<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vreme prolazi</title>
    <style>
        :root { color-scheme: dark; font-family: Georgia, "Times New Roman", serif; }
        * { box-sizing: border-box; }
        html, body {
            min-height: 100%; margin: 0;
            background: radial-gradient(circle at 50% 20%, rgba(143, 82, 43, .22), transparent 38rem), #080706;
        }
        body { display: grid; place-items: center; padding: clamp(14px, 4vw, 44px); color: #f7e8d0; }
        .uspomena { width: min(100%, 920px); text-align: center; }
        .slika-okvir {
            overflow: hidden; border: 1px solid rgba(255, 210, 147, .22); border-radius: 18px;
            background: #111; box-shadow: 0 24px 80px rgba(0, 0, 0, .72);
        }
        .slika-okvir img { display: block; width: 100%; height: auto; }
        .vreme { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: clamp(20px, 4vw, 34px); }
        .pescani-sat {
            display: grid; width: 70px; height: 70px; place-items: center;
            border: 1px solid rgba(244, 185, 104, .3); border-radius: 50%;
            background: rgba(255, 183, 82, .08); box-shadow: 0 0 32px rgba(255, 151, 50, .14);
            font-size: 36px; animation: okretanje 6s ease-in-out infinite;
        }
        .brojac {
            display: grid; grid-template-columns: repeat(4, minmax(64px, 1fr));
            gap: clamp(7px, 2vw, 16px); width: min(100%, 570px);
        }
        .jedinica {
            padding: 12px 7px 10px; border: 1px solid rgba(255, 221, 177, .16);
            border-radius: 12px; background: rgba(255, 255, 255, .04);
        }
        .broj {
            display: block; font: 600 clamp(24px, 6vw, 42px) "Courier New", monospace;
            font-variant-numeric: tabular-nums; line-height: 1; color: #ffc779;
            text-shadow: 0 0 18px rgba(255, 151, 50, .28);
        }
        .oznaka {
            display: block; margin-top: 8px; color: rgba(255, 241, 220, .66);
            font: 700 10px/1.2 Arial, sans-serif; letter-spacing: .15em; text-transform: uppercase;
        }
        .od-datuma { margin: -5px 0 0; color: rgba(255, 241, 220, .55); font-size: 14px; letter-spacing: .08em; }
        @keyframes okretanje {
            0%, 42% { transform: rotate(0deg); }
            50%, 92% { transform: rotate(180deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 430px) { .brojac { grid-template-columns: repeat(2, 1fr); } }
        @media (prefers-reduced-motion: reduce) { .pescani-sat { animation: none; } }
    </style>
</head>
<body>
    <main class="uspomena">
        <div class="slika-okvir">
            <img src="ivana.jpg" alt="Ilustracija muškarca koji misli na voljenu osobu">
        </div>
        <section class="vreme" aria-label="Vreme proteklo od 6. oktobra 2025.">
            <div class="pescani-sat" aria-hidden="true">⌛</div>
            <div class="brojac" role="timer" aria-live="off">
                <div class="jedinica"><span class="broj" id="dani">0</span><span class="oznaka">dana</span></div>
                <div class="jedinica"><span class="broj" id="sati">00</span><span class="oznaka">sati</span></div>
                <div class="jedinica"><span class="broj" id="minute">00</span><span class="oznaka">minuta</span></div>
                <div class="jedinica"><span class="broj" id="sekunde">00</span><span class="oznaka">sekundi</span></div>
            </div>
            <p class="od-datuma">od 6. oktobra 2025.</p>
        </section>
    </main>
    <script>
        const pocetak = new Date("2025-10-06T00:00:00+02:00").getTime();
        const polja = {
            dani: document.getElementById("dani"), sati: document.getElementById("sati"),
            minute: document.getElementById("minute"), sekunde: document.getElementById("sekunde")
        };
        function osvjeziBrojac() {
            const ukupnoSekundi = Math.max(0, Math.floor((Date.now() - pocetak) / 1000));
            const dani = Math.floor(ukupnoSekundi / 86400);
            const sati = Math.floor((ukupnoSekundi % 86400) / 3600);
            const minute = Math.floor((ukupnoSekundi % 3600) / 60);
            const sekunde = ukupnoSekundi % 60;
            polja.dani.textContent = dani;
            polja.sati.textContent = String(sati).padStart(2, "0");
            polja.minute.textContent = String(minute).padStart(2, "0");
            polja.sekunde.textContent = String(sekunde).padStart(2, "0");
        }
        osvjeziBrojac();
        setInterval(osvjeziBrojac, 1000);
    </script>
</body>
</html>
